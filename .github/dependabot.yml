version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      # One PR per ecosystem rather than fifteen. Patch noise is what makes
      # teams stop reading Dependabot entirely.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      radix:
        patterns: ['@radix-ui/*']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', '@playwright/*', 'jsdom']
      linting:
        patterns: ['eslint', 'eslint-*', 'prettier', 'prettier-*', 'typescript']

  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: '/'
    schedule:
      interval: monthly
